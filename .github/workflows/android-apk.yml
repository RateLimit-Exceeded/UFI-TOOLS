name: Build Android APK on Push

on:
  push:
    branches:
      - '1007'

jobs:
  build:
    environment: ANDROID_KEYSTORE_BASE64
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Prepare signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            cat <<EOF >> local.properties
MYAPP_RELEASE_STORE_FILE=release.keystore
MYAPP_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
MYAPP_RELEASE_STORE_PASSWORD=$ANDROID_STORE_PASSWORD
MYAPP_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
EOF
            echo "SIGNING_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_PRESENT=false" >> "$GITHUB_ENV"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        if: ${{ env.SIGNING_PRESENT == 'true' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (fallback)
        if: ${{ env.SIGNING_PRESENT != 'true' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/**/*.apk
