name: Sync upstream http-server-version

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }} 
          persist-credentials: true

      - name: Set up git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/kanoqwq/UFI-TOOLS.git
          else
            git remote add upstream https://github.com/kanoqwq/UFI-TOOLS.git
          fi
          git fetch upstream http-server-version

      - name: Sync branch
        run: |
          git checkout -B http-server-version upstream/http-server-version
          git push origin http-server-version --force-with-lease
